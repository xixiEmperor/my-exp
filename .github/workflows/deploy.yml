name: Deploy Go Backend

on:
    push:
        branches:
            - master
        paths:
            - 'server/**'
            - '.github/workflows/deploy.yml'

    # Allow manual deployment from the GitHub Actions page.
    workflow_dispatch:

# Prevent two deployments from modifying the server at the same time.
concurrency:
    group: go-backend-deploy
    cancel-in-progress: false

# 工作流只需要读取仓库中的部署脚本。
permissions:
    contents: read

jobs:
    deploy:
        name: Build on Server and Deploy
        runs-on: ubuntu-latest
        # 自动和手动部署都只使用 master 的部署脚本。
        if: github.ref == 'refs/heads/master'
        timeout-minutes: 30

        # 指定使用 GitHub 中名为 SERVER_HOST 的 Environment
        environment: SERVER_HOST

        steps:
            # 1. Check out the repository.
            - name: Checkout
              uses: actions/checkout@v4

            # 4. Configure SSH.
            - name: Setup SSH
              env:
                  SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
                  SSH_HOST: ${{ secrets.SERVER_HOST }}
                  SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
              run: |
                  mkdir -p ~/.ssh
                  chmod 700 ~/.ssh

                  printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
                  chmod 600 ~/.ssh/id_ed25519

                  ssh-keyscan -H -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
                  chmod 600 ~/.ssh/known_hosts

            # 服务器拉取 master，使用本机 Go 编译，成功后重启并检查服务。
            - name: Pull, Build and Restart on Server
              env:
                  SSH_HOST: ${{ secrets.SERVER_HOST }}
                  SSH_USER: ${{ secrets.SERVER_USER }}
                  SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
                  REPOSITORY: ${{ github.repository }}
              run: |
                  ssh -i ~/.ssh/id_ed25519 \
                    -o BatchMode=yes -o ConnectTimeout=30 \
                    -p "$SSH_PORT" \
                    "$SSH_USER@$SSH_HOST" \
                    "bash -s -- 'git@github.com:$REPOSITORY.git'" \
                    < server/scripts/deploy.sh

            # 7. Remove the temporary private-key file even if an earlier step fails.
            - name: Cleanup SSH key
              if: always()
              run: rm -f ~/.ssh/id_ed25519
